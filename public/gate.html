<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>iPad 入閘端</title><link rel="stylesheet" href="style.css"><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script></head><body><main class="shell"><header class="topbar"><div class="brand"><div class="mark">PG</div><div><h1>樂園入閘閘口</h1><p>IPAD GATE TERMINAL</p></div></div><div class="userbar"><span id="who">未登入</span><button id="login" class="primary">工作人員登入</button><button id="logout" class="hidden">登出</button></div></header><div id="msg" class="message">請使用已授權閘口人員 Google 帳戶登入。</div><section id="app" class="hidden"><div class="grid"><div class="card s6"><div class="head"><h2>01｜QR Code 掃描</h2><span class="tag">SCANNER</span></div><div class="body"><div id="reader"></div><button id="scan" class="primary" style="width:100%;margin-top:12px">啟動 QR 掃描</button><div class="field"><label>閘口編號</label><input id="gateId" value="GATE-01"></div></div></div><div class="card s6"><div class="head"><h2>02｜人臉核對</h2></div><div class="body"><div class="camera"><video id="video" autoplay muted playsinline></video><div class="scan-frame"></div></div><button id="faceStart" style="width:100%;margin-top:12px">啟動人臉鏡頭</button><p class="fine">只上傳即時特徵向量作伺服器比對，不上傳照片或影片。必須依園區政策取得同意。</p></div></div><div class="card s12"><div class="head"><h2>入閘結果</h2><span id="state" class="tag warn">等待掃描</span></div><div class="body"><div id="result" class="result"><h2>準備就緒</h2><p>請掃描有效門票。</p></div><div id="manual" class="hidden"><div class="field"><label>人工核實原因</label><input id="reason" placeholder="例如：主管核實身份及紙本憑證"></div><button id="manualBtn" class="danger">人工核實後核銷</button></div></div></div></div></section><p class="fine">人臉辨識不具活體檢測能力，不能單獨作為身份證明。匹配失敗時須人工核實。</p></main><script type="module" src="gate.js"></script></body></html>
