<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理後台｜PARK GATE</title><link rel="stylesheet" href="style.css"><script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script><script defer src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script></head><body><main class="shell"><header class="topbar"><div class="brand"><div class="mark">PG</div><div><h1>樂園管理中心</h1><p>PARK GATE · ADMIN CONSOLE</p></div></div><div class="userbar"><span id="userLabel">未登入</span><button id="login" class="primary">Google 管理員登入</button><button id="logout" class="hidden">登出</button></div></header><div id="authMsg" class="message">請使用已授權管理員帳戶登入。</div><section id="app" class="hidden"><div class="grid">
<div class="card s12"><div class="head"><h2>營運概覽</h2><button id="refresh">重新整理</button></div><div class="body"><div class="stats"><div class="stat"><b id="visitors">0</b><span>遊客</span></div><div class="stat"><b id="tickets">0</b><span>門票</span></div><div class="stat"><b id="uses">0</b><span>已核銷次數</span></div><div class="stat"><b id="today">0</b><span>今日入閘</span></div></div></div></div>
<div class="card s6"><div class="head"><h2>建立門票</h2></div><div class="body"><div class="field"><label>遊客編號</label><input id="visitorId" placeholder="VIS-0001"></div><div class="field"><label>遊客姓名</label><input id="visitorName" placeholder="姓名"></div><div class="field"><label>門票類型</label><select id="type"><option value="single">單次門票</option><option value="multi">多次門票</option><option value="multi_day">多日門票</option></select></div><div class="row"><div class="field"><label>可用次數</label><input id="maxUses" type="number" min="1" max="10000" value="5"></div><div class="field"><label>有效天數</label><input id="days" type="number" min="1" max="365" value="30"></div></div><button id="create" class="primary">建立門票及 QR Code</button><div id="ticketMsg"></div><div id="qrBox" class="hidden"><div id="qr"></div><p id="qrInfo" class="fine"></p><button id="download">下載 QR Code</button></div></div></div>
<div class="card s6"><div class="head"><h2>登記遊客人臉</h2><span class="tag warn">敏感生物特徵</span></div><div class="body"><div class="field"><label>遊客編號（先建立門票）</label><input id="faceId"></div><div class="camera"><video id="faceVideo" autoplay muted playsinline></video><div class="scan-frame"></div></div><p class="fine">必須取得本人明確同意。只傳送特徵向量，不上傳照片或影片。</p><div class="row"><button id="faceStart">啟動鏡頭</button><button id="faceEnroll" class="primary" disabled>擷取並登記</button><button id="faceDelete" class="danger">撤回同意／刪除人臉資料</button></div><label class="fine"><input type="checkbox" id="consent"> 已取得明確同意並告知用途。</label><div id="faceMsg"></div></div></div>
<div class="card s12"><div class="head"><h2>門票管理</h2></div><div class="table-wrap"><table><thead><tr><th>門票</th><th>遊客</th><th>類型</th><th>使用</th><th>有效期</th><th>狀態</th><th>操作</th></tr></thead><tbody id="ticketRows"><tr><td colspan="7" class="empty">尚無資料</td></tr></tbody></table></div></div>
<div class="card s12"><div class="head"><h2>入閘紀錄</h2></div><div class="table-wrap"><table><thead><tr><th>時間</th><th>事件</th><th>遊客</th><th>閘口</th><th>備註</th></tr></thead><tbody id="logRows"><tr><td colspan="5" class="empty">尚無紀錄</td></tr></tbody></table></div></div></div></section><p class="fine">人臉辨識只作輔助核對；未匹配或不確定時應人工核實。</p></main><script type="module" src="admin.js"></script></body></html>
