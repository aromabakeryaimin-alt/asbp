<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPad 後台人面識別系統 (PoC)</title>
  <!-- 載入 Face-API.js -->
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
  <style>
    /* 深色主題配色 */
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 20px; background: #0a192f; color: #ccd6f6; }
    h2 { color: #64ffda; }
    .video-container { position: relative; display: inline-block; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border-radius: 12px; overflow: hidden; }
    video { width: 100%; max-width: 640px; background: #000; display: block; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .controls { padding: 10px; background: #112240; border-radius: 12px; max-width: 640px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    input { padding: 12px; margin: 8px; border-radius: 6px; border: 1px solid #233554; background: #0a192f; color: #fff; font-size: 16px; outline: none; }
    input:focus { border-color: #64ffda; }
    button { padding: 12px 20px; margin: 8px; border-radius: 6px; border: none; font-size: 16px; font-weight: bold; background: #64ffda; color: #0a192f; cursor: pointer; transition: 0.3s; }
    button:active { transform: scale(0.95); }
    button:disabled { background: #444; color: #888; cursor: not-allowed; }
    #status { margin-bottom: 15px; font-size: 14px; font-weight: bold; color: #ffb86c; }
  </style>
</head>
<body>
  <h2>人面資料錄入與識別系統</h2>
  <div id="status">正在從雲端載入 AI 模型 (約 10MB)，請稍候...</div>
  
  <div class="video-container">
    <!-- iPad 必須加上 autoplay muted playsinline 才能正常顯示鏡頭 -->
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>
  
  <div class="controls">
    <input type="text" id="userName" placeholder="輸入用戶姓名或編號">
    <button id="btnRegister" disabled>1. 錄入當前人面</button>
    <button id="btnRecognize" disabled>2. 開始即時識別</button>
    <button id="btnClear" onclick="clearData()" style="background: #ff5555; color: white;">清除所有資料</button>
  </div>

  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const status = document.getElementById('status');
    const userNameInput = document.getElementById('userName');
    const btnRegister = document.getElementById('btnRegister');
    const btnRecognize = document.getElementById('btnRecognize');

    let faceMatcher = null;
    let recognitionInterval;

    // 1. 初始化：載入模型
    const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
    async function init() {
      try {
        await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
        status.innerText = "模型載入完成！正在要求鏡頭權限...";
        status.style.color = "#50fa7b";
        startVideo();
      } catch (e) {
        status.innerText = "模型載入失敗，請檢查網絡連線。";
        status.style.color = "#ff5555";
      }
    }

    // 2. 開啟鏡頭
    function startVideo() {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
        .then(stream => {
          video.srcObject = stream;
          // 確保影片中繼資料載入後才解鎖按鈕
          video.onloadedmetadata = () => {
            btnRegister.disabled = false;
            btnRecognize.disabled = false;
            status.innerText = "系統就緒。請先輸入姓名錄入面部，或直接開始識別。";
            updateFaceMatcher();
          };
        })
        .catch(err => {
          status.innerText = "無法存取鏡頭！請確保使用 HTTPS 或 Localhost 開啟。";
          status.style.color = "#ff5555";
        });
    }

    // 3. 後台錄入邏輯 (提取特徵並存入 LocalStorage)
    btnRegister.addEventListener('click', async () => {
      const name = userNameInput.value.trim();
      if (!name) { alert("請先輸入姓名"); return; }
      status.innerText = "正在讀取面孔，請正視鏡頭...";

      // 提取 128 維特徵矩陣
      const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
      
      if (!detection) {
        alert("找不到人臉，請確認臉部完全在畫面中，且光線充足！");
        status.innerText = "系統就緒。";
        return;
      }

      // 將 Float32Array 轉換為一般陣列以轉換成 JSON 儲存
      const descriptorArray = Array.from(detection.descriptor);
      let savedFaces = JSON.parse(localStorage.getItem('faces') || '{}');
      savedFaces[name] = descriptorArray;
      localStorage.setItem('faces', JSON.stringify(savedFaces));

      alert(`✅ 成功錄入：${name} 的面部資料`);
      userNameInput.value = "";
      status.innerText = `最後錄入成功：${name}`;
      updateFaceMatcher(); // 更新比對資料庫
    });

    // 4. 重建比對器 (載入 LocalStorage 內的資料)
    function updateFaceMatcher() {
      const savedFaces = JSON.parse(localStorage.getItem('faces') || '{}');
      const labeledDescriptors = [];
      
      for (const [name, descriptor] of Object.entries(savedFaces)) {
        // 將陣列還原為 Float32Array
        labeledDescriptors.push(
          new faceapi.LabeledFaceDescriptors(name, [new Float32Array(descriptor)])
        );
      }
      
      if (labeledDescriptors.length > 0) {
        // 0.45 為距離閾值，越低越嚴格（0.4~0.5 為合理區間）
        faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.45);
      } else {
        faceMatcher = null;
      }
    }

    // 5. 即時識別邏輯 (循環偵測與比對)
    btnRecognize.addEventListener('click', () => {
      if (!faceMatcher) {
        alert("資料庫為空，請先錄入至少一張面部資料！");
        return;
      }
      
      if (btnRecognize.innerText === "停止識別") {
        clearInterval(recognitionInterval);
        btnRecognize.innerText = "2. 開始即時識別";
        btnRecognize.style.background = "#64ffda";
        overlay.getContext('2d').clearRect(0, 0, overlay.width, overlay.height);
        status.innerText = "識別已暫停。";
        return;
      }

      btnRecognize.innerText = "停止識別";
      btnRecognize.style.background = "#ffb86c";
      status.innerText = "正在即時掃描畫面中的人臉...";

      const displaySize = { width: video.videoWidth, height: video.videoHeight };
      faceapi.matchDimensions(overlay, displaySize);

      // 每 150 毫秒截圖比對一次
      recognitionInterval = setInterval(async () => {
        const detections = await faceapi.detectAllFaces(video).withFaceLandmarks().withFaceDescriptors();
        const resizedDetections = faceapi.resizeResults(detections, displaySize);

        const ctx = overlay.getContext('2d');
        ctx.clearRect(0, 0, overlay.width, overlay.height);

        resizedDetections.forEach(d => {
          // 在資料庫中尋找最接近的人臉
          const bestMatch = faceMatcher.findBestMatch(d.descriptor);
          
          // 畫出人臉方框與名字文字
          const box = d.detection.box;
          const drawBox = new faceapi.draw.DrawBox(box, { 
            label: bestMatch.toString(), 
            boxColor: bestMatch.label === "unknown" ? "red" : "#50fa7b" 
          });
          drawBox.draw(overlay);
        });
      }, 150);
    });

    // 6. 清除資料功能
    function clearData() {
      if(confirm("確定要刪除所有已錄入的面部資料嗎？")) {
        localStorage.removeItem('faces');
        faceMatcher = null;
        alert("資料已清空！");
        updateFaceMatcher();
      }
    }

    // 啟動程式
    window.onload = init;
  </script>
</body>
</html>
